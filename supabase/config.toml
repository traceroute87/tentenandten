# Minimal Supabase local config. `supabase start` then `supabase db reset`
# applies migrations/. For a hosted project, run the SQL in migrations/ via
# the dashboard SQL editor or `supabase db push`.
project_id = "ten-ten-ten"

[auth]
enable_signup = true
# Email one-time code only; no passwords in V1. The Magic Link and Confirm signup email
# templates must include {{ .Token }} (the code) for sign-in to work.
[auth.email]
enable_signup = true
enable_confirmations = false
